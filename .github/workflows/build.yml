name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: 17
  GRADLE_TASK: shadowJar
  JAR_NAME: Moonlight.jar
  JSON_NAME: Moonlight.json
  BUILD_DIR: build/libs
  JSON_DIR: json

jobs:
  build:
    runs-on: ubuntu-latest

    # Release 需要写权限（upload-artifact 不需要）
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Grant Execute Permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Project with Gradle
        run: ./gradlew ${{ env.GRADLE_TASK }} --no-daemon

      - name: Rename and Move Files to Root
        run: |
          # 兼容不同 shadow 产物名
          JAR=$(ls ${BUILD_DIR}/*-all.jar ${BUILD_DIR}/*.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then
            echo "No jar found in ${BUILD_DIR}"
            ls -la ${BUILD_DIR} || true
            exit 1
          fi
          cp "$JAR" "${GITHUB_WORKSPACE}/${JAR_NAME}"
          cp "${JSON_DIR}/MoonLight.json" "${GITHUB_WORKSPACE}/${JSON_NAME}" 2>/dev/null \
            || cp "${JSON_DIR}/Moonlight.json" "${GITHUB_WORKSPACE}/${JSON_NAME}" 2>/dev/null \
            || true
          ls -la "${GITHUB_WORKSPACE}/${JAR_NAME}" "${GITHUB_WORKSPACE}/${JSON_NAME}" || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight
          path: |
            ${{ env.JAR_NAME }}
            ${{ env.JSON_NAME }}
          if-no-files-found: warn

      # 仅 push 到主分支时打 latest 预发布（PR 不发 Release）
      - name: Create / Update Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ env.JAR_NAME }}
            ${{ env.JSON_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
